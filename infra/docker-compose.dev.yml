name: binaai-dev

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "2"

services:
  postgres:
    image: postgres:16-alpine
    profiles: ["core", "full"]
    mem_limit: 256m
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bina}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bina_dev}
      POSTGRES_DB: ${POSTGRES_DB:-bina_dev}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - bina_pg_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - bina_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bina} -d ${POSTGRES_DB:-bina_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    profiles: ["core", "full"]
    mem_limit: 128m
    restart: unless-stopped
    logging: *default-logging
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "96mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-16379}:6379"
    volumes:
      - bina_redis_data:/data
    networks:
      - bina_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: cgr.dev/chainguard/minio:latest
    profiles: ["storage", "full"]
    mem_limit: 256m
    restart: unless-stopped
    logging: *default-logging
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "127.0.0.1:${MINIO_API_HOST_PORT:-19000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-19001}:9001"
    volumes:
      - bina_minio_data:/data
    networks:
      - bina_net

  temporal:
    image: temporalio/auto-setup:1.25.2
    profiles: ["temporal", "full"]
    mem_limit: 384m
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-bina}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-bina_dev}
      POSTGRES_SEEDS: postgres
    ports:
      - "127.0.0.1:${TEMPORAL_HOST_PORT:-17233}:7233"
    networks:
      - bina_net

volumes:
  bina_pg_data:
  bina_redis_data:
  bina_minio_data:

networks:
  bina_net:
    driver: bridge
