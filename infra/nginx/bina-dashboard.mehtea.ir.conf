server {
    listen 80;
    listen [::]:80;
    server_name bina-dashboard.mehtea.ir;

    root /var/www/bina-dashboard.mehtea.ir;
    index index.html;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Security headers (zero-RAM static host nginx serving)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compression for Staff Web JS/CSS/WOFF2/SVG
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        font/woff2
        image/svg+xml;

    # Always fetch latest SPA entrypoint
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # Long-term immutable cache for hashed Vite chunks, Vazirmatn WOFF2 & runtime artwork
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Optional: uncomment when live backend is running on 127.0.0.1:3000
    # location /v1/ {
    #     proxy_pass http://127.0.0.1:3000;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # SPA fallback for React Router v8 routes (/login, /overview, /patients, /diagnostics, /care, /triage, /monitoring, /analytics, /admin, /ops, ...)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
