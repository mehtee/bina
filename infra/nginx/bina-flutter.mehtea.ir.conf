server {
    listen 80;
    listen [::]:80;
    server_name bina-flutter.mehtea.ir;

    root /var/www/bina-flutter.mehtea.ir;
    index index.html;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compression for Flutter Web JS/WASM/JSON/Fonts
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/wasm
        font/ttf
        image/svg+xml;

    # Ensure bootstrap & HTML always fetch latest release
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /version.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # Cache self-hosted CanvasKit, Vazirmatn fonts, and runtime visual assets
    location ~* ^/(canvaskit|assets|icons)/ {
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # SPA fallback for go_router routes (/today, /care, /tests, /results, /account, /help/urgent)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
