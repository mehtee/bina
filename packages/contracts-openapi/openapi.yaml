                $ref: "#/components/schemas/ClinicFeatureFlagRecord"

  /v1/integrations/endpoints:
    get:
      tags: [Integrations]
      operationId: listIntegrationEndpoints
      summary: List configured DICOM/FHIR/HIS/iCare/SMS endpoints (credentials masked only)
      responses:
        "200":
          description: Endpoint configurations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationEndpointListResponse"
    post:
      tags: [Integrations]
      operationId: createIntegrationEndpoint
      summary: Register integration endpoint (masks secrets on persistence)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIntegrationEndpointRequest"
      responses:
        "201":
          description: Integration endpoint created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationEndpointRecord"

  /v1/integrations/endpoints/{endpointId}:
    patch:
      tags: [Integrations]
      operationId: updateIntegrationEndpoint
      summary: Update integration endpoint settings
      parameters:
        - $ref: "#/components/parameters/EndpointIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateIntegrationEndpointRequest"
      responses:
        "200":
          description: Integration endpoint updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationEndpointRecord"

  /v1/integrations/endpoints/{endpointId}/test:
    post:
      tags: [Integrations]
      operationId: testIntegrationEndpoint
      summary: Run safe configuration & connectivity validation probe for an endpoint
      parameters:
        - $ref: "#/components/parameters/EndpointIdParam"
      responses:
        "200":
          description: Probe outcome and delivery record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestIntegrationEndpointResponse"

  /v1/integrations/history:
    get:
      tags: [Integrations]
      operationId: listIntegrationDeliveries
      summary: Paginated inbound/outbound integration delivery and retry history
      parameters:
        - name: endpointId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum: ["queued", "delivered", "failed", "retrying"]
        - name: direction
          in: query
          schema:
            type: string
            enum: ["inbound", "outbound"]
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Delivery history list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationDeliveryListResponse"

  /v1/ops/health:
    get:
      tags: [Ops]
      operationId: getOpsHealth
      summary: Authenticated clinic operations health summary including DB latency and queue backlogs
      responses:
        "200":
          description: Operations health payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsHealthResponse"

  /v1/ops/jobs:
    get:
      tags: [Ops]
      operationId: listOpsJobs
      summary: List recent AI inference jobs, transactional outbox events, and durable workflows
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Operations jobs summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsJobsResponse"

  /v1/ops/audit:
    get:
      tags: [Ops]
      operationId: listAuditLogs
      summary: Step-up MFA protected PHI-redacted immutable audit log viewer
      parameters:
        - name: action
          in: query
          schema:
            type: string
        - name: resourceType
          in: query
          schema:
            type: string
        - name: actorUserId
          in: query
          schema:
            type: string
            format: uuid
        - name: breakGlassOnly
          in: query
          schema:
            type: boolean
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Redacted immutable audit log entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogListResponse"

  /v1/ops/break-glass:
    get:
      tags: [Ops]
      operationId: listBreakGlassSessions
      summary: List audited emergency break-glass access sessions
      parameters:
        - name: activeOnly
          in: query
          schema:
            type: boolean
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Break-glass sessions list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BreakGlassSessionListResponse"
    post:
      tags: [Ops]
      operationId: openBreakGlassSession
      summary: Open time-limited audited break-glass session (requires >= 10 char clinical reason)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenBreakGlassRequest"
      responses:
        "201":
          description: Break-glass session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BreakGlassSessionRecord"

  /v1/ops/break-glass/{sessionId}/revoke:
    post:
      tags: [Ops]
      operationId: revokeBreakGlassSession
      summary: Immediately revoke an active break-glass emergency session
      parameters:
        - $ref: "#/components/parameters/BreakGlassSessionIdParam"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevokeBreakGlassRequest"
      responses:
        "200":
          description: Break-glass session revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BreakGlassSessionRecord"

  /v1/ops/models:
    get:
      tags: [Ops]
      operationId: listOpsModels
      summary: List active commercial-safe AI engine configuration, LLM config, and exported ONNX model card artifacts
      responses:
        "200":
          description: Model registry inventory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsModelsResponse"

  /v1/ai-engine/qc:
    post:
      tags: [AiEngineInternal]
      operationId: runAiEngineQc
      summary: Internal AI Engine Layer 1 Modality Router and Quality Gate check
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiEngineQcRequest"
      responses:
        "200":
          description: Layer 1 QC evaluation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QcDecision"

  /v1/ai-engine/analyze-study:
    post:
      tags: [AiEngineInternal]
      operationId: runAiEngineAnalysis
      summary: Internal AI Engine Layers 1-4 synchronous execution endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiEngineAnalyzeRequest"
      responses:
        "200":
          description: Complete Layer 1-4 AI engine output
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiEngineAnalyzeResponse"

components:
  parameters:
    PatientIdParam:
      name: patientId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GrantIdParam:
      name: grantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EpisodeIdParam:
      name: episodeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CaseIdParam:
      name: caseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StudyIdParam:
      name: studyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReportIdParam:
      name: reportId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OutageIdParam:
      name: outageId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReferralIdParam:
      name: referralId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TaskIdParam:
      name: taskId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionIdParam:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeviceIdParam:
      name: deviceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MembershipIdParam:
      name: membershipId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EndpointIdParam:
      name: endpointId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BreakGlassSessionIdParam:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    EyeLaterality:
      type: string
      enum: ["OD", "OS"]
      description: Strict single-eye laterality (OD = چشم راست, OS = چشم چپ)

    StudyLaterality:
      type: string
      enum: ["OD", "OS", "OU"]

    AccessMode:
      type: string
      enum: ["app", "caregiver", "print_phone"]

    StaffRole:
      type: string
      enum: ["ophthalmologist", "optometrist", "technician", "coordinator", "admin"]

    UrgencyTier:
      type: string
      enum: ["routine", "followup_3_6m", "urgent"]

    SeverityGrade:
      type: string
      enum: ["mild", "moderate", "severe", "urgent"]

    DiagnosticModality:
      type: string
      enum: ["fundus", "oct", "octa", "slit_lamp", "topography", "visual_field", "tabular_labs", "unknown"]

    AdherenceState:
      type: string
      enum: ["taken", "missed_with_reason", "unavailable", "no_response"]

    StudyStatus:
      type: string
      enum: ["ingested", "qc_failed", "queued", "analyzed", "pending_hitl", "signed_off"]

    SignoffAction:
      type: string
      enum: ["approved", "edited_approved", "rejected"]

    QcRejectionCode:
      type: string
      enum: ["blur", "lighting", "wrong_eye", "modality_mismatch"]

    AiEngineMode:
      type: string
      enum: ["cpu_stub", "onnx_cpu", "gpu_full"]

    HealthStatus:
      type: object
      required: [status, service, locale, calendar, jurisdiction, aiEngineMode, llmProvider, llmModel, llmConfigured, timestamp]
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: bina-backend
        locale:
          type: string
          example: fa-IR
        calendar:
          type: string
          example: jalali
        jurisdiction:
          type: string
          example: IR
        aiEngineMode:
          $ref: "#/components/schemas/AiEngineMode"
        llmProvider:
          type: string
          example: openai_compatible
        llmModel:
          type: string
          example: thinkingmachines/inkling-2-mini
        llmConfigured:
          type: boolean
        timestamp:
          type: string
          format: date-time

    ClinicProfile:
      type: object
      required: [clinicId, tenantId, nameFa, locale, calendarMode, emergencyPhone, staffedHoursFa]
      properties:
        clinicId:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        nameFa:
          type: string
          example: کلینیک فوق‌تخصصی چشم نور تهران
        locale:
          type: string
          example: fa-IR
        calendarMode:
          type: string
          example: jalali
        emergencyPhone:
          type: string
          example: "+982182400000"
        staffedHoursFa:
          type: string
          example: شنبه تا چهارشنبه ۸ تا ۲۰ — پنج‌شنبه ۸ تا ۱۴
        todayJalali:
          type: string
          example: "۱۴۰۵/۰۹/۰۲"
        currentlyStaffed:
          type: boolean

    StaffStepUpRequest:
      type: object
      required: [stepUpCode]
      properties:
        stepUpCode:
          type: string

    StaffStepUpResponse:
      type: object
      required: [accessToken, stepUpVerified]
      properties:
        accessToken:
          type: string
        stepUpVerified:
          type: boolean

    StaffSessionRequest:
      type: object
      required: [oidcToken, clinicId]
      properties:
        oidcToken:
          type: string
        clinicId:
          type: string
          format: uuid
        mfaCode:
          type: string

    StaffSessionResponse:
      type: object
      required: [accessToken, role, mfaVerified, userId, clinicId, tenantId]
      properties:
        accessToken:
          type: string
        role:
          $ref: "#/components/schemas/StaffRole"
        mfaVerified:
          type: boolean
        userId:
          type: string
          format: uuid
        clinicId:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid

    PatientOtpRequest:
      type: object
      required: [phoneNumber, clinicId]
      properties:
        phoneNumber:
          type: string
          pattern: "^\\+989\\d{9}$"
          example: "+989123456789"
        clinicId:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid

    OtpDispatchResponse:
      type: object
      required: [challengeId, expiresInSeconds, maskedPhone]
      properties:
        challengeId:
          type: string
          format: uuid
        expiresInSeconds:
          type: integer
        maskedPhone:
          type: string
          example: "+98912***6789"

    PatientOtpVerifyRequest:
      type: object
      required: [challengeId, otpCode, consentAccepted, consentVersion, phoneNumber]
      properties:
        challengeId:
          type: string
          format: uuid
        otpCode:
          type: string
          example: "482910"
        consentAccepted:
          type: boolean
        consentVersion:
          type: string
          example: fa-IR-v1.0
        phoneNumber:
          type: string
          pattern: "^\\+989\\d{9}$"
          example: "+989123456789"
        tenantId:
          type: string
          format: uuid

    PatientSessionResponse:
      type: object
      required: [accessToken, patientId, tenantId, locale, calendarMode]
      properties:
        accessToken:
          type: string
        patientId:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        clinicId:
          type: string
          format: uuid
        locale:
          type: string
          example: fa-IR
        calendarMode:
          type: string
          example: jalali

    CaregiverOtpVerifyRequest:
      type: object
      required: [challengeId, otpCode]
      properties:
        challengeId:
          type: string
          format: uuid
        otpCode:
          type: string
          example: "482910"
        tenantId:
          type: string
          format: uuid
        patientId:
          type: string
          format: uuid

    CaregiverPatientLink:
      type: object
      required: [grantId, patientId, patientNameFa, relationshipFa, scopes, clinicId, active, createdAt]
      properties:
        grantId:
          type: string
          format: uuid
        patientId:
          type: string
          format: uuid
        patientNameFa:
          type: string
          example: علی رضایی
        relationshipFa:
          type: string
          example: فرزند بیمار
        scopes:
          type: array
          items:
            type: string
        clinicId:
          type: string
          format: uuid
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time

    CaregiverSessionResponse:
      type: object
      required: [accessToken, grantId, patientId, tenantId, clinicId, locale, calendarMode, patients]
      properties:
        accessToken:
          type: string
        grantId:
          type: string
          format: uuid
        patientId:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        clinicId:
          type: string
          format: uuid
        locale:
          type: string
          example: fa-IR
        calendarMode:
          type: string
          example: jalali
        patients:
          type: array
          items:
            $ref: "#/components/schemas/CaregiverPatientLink"

    CaregiverPatientListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CaregiverPatientLink"

    CaregiverGrantListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CaregiverGrant"

    ConsentRecord:
      type: object
      required: [consentId, consentVersion, locale, acceptedAt]
      properties:
        consentId:
          type: string
          format: uuid
        consentVersion:
          type: string
          example: fa-IR-v1.0
        locale:
          type: string
          example: fa-IR
        acceptedAt:
          type: string
          format: date-time

    PatientProfileResponse:
      type: object
      required: [patientId, tenantId, clinicId, fullNameFa, phoneMasked, preferredLocale, accessMode, consents]
      properties:
        patientId:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        clinicId:
          type: string
          format: uuid
        fullNameFa:
          type: string
          example: بیمار محترم
        phoneMasked:
          type: string
          example: "+98912***6789"
        preferredLocale:
          type: string
          example: fa-IR
        accessMode:
          $ref: "#/components/schemas/AccessMode"
        consents:
          type: array
          items:
            $ref: "#/components/schemas/ConsentRecord"

    CaregiverGrantRequest:
      type: object
      required: [caregiverPhone, relationshipFa, scopes]
      properties:
        caregiverPhone:
          type: string
          pattern: "^\\+989\\d{9}$"
          example: "+989129876543"
        relationshipFa:
          type: string
          example: فرزند بیمار
        scopes:
          type: array
          items:
            type: string

    CaregiverGrant:
      type: object
      required: [grantId, patientId, caregiverPhone, relationshipFa, scopes, active, createdAt]
      properties:
        grantId:
          type: string
          format: uuid
        patientId:
          type: string
          format: uuid
        caregiverPhone:
          type: string
          example: "+989129876543"
        relationshipFa:
          type: string
          example: فرزند بیمار
        scopes:
          type: array
          items:
            type: string
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time

    CreateEpisodeRequest:
      type: object
      required: [patientId, protocolType, eyeLaterality, surgeonId, accessMode, anchorAt]
      properties:
        patientId:
          type: string
          format: uuid
        protocolType:
          type: string
          example: post_cataract
        eyeLaterality:
          $ref: "#/components/schemas/EyeLaterality"
        surgeonId:
          type: string
          format: uuid
        accessMode:
          $ref: "#/components/schemas/AccessMode"
        anchorAt:
          type: string
          format: date-time

    CareEpisode:
      type: object
      required: [episodeId, tenantId, patientId, protocolType, eyeLaterality, eyeLabelFa, accessMode, activePrescriptionVersion, status, anchorAt]
      properties:
        episodeId:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        patientId:
          type: string
          format: uuid
        protocolType:
          type: string
          example: post_cataract
        eyeLaterality:
          $ref: "#/components/schemas/EyeLaterality"
        eyeLabelFa:
          type: string
          example: چشم راست
        accessMode:
          $ref: "#/components/schemas/AccessMode"
        activePrescriptionVersion:
          type: integer
        status:
          type: string
          example: active
        anchorAt:
          type: string
          format: date-time

    DropItemInput:
      type: object
      required: [drugNameFa, genericName, bottleCapColorFa, frequencyPerDay, durationDays]
      properties:
        drugNameFa:
          type: string
          example: قطره بتامتازون چشمی ۰.۱٪
        genericName:
          type: string
          example: Betamethasone 0.1%
        bottleCapColorFa:
          type: string
          example: درِ صورتی
        frequencyPerDay:
          type: integer
        durationDays:
          type: integer
        instructionsFa:
          type: string
          example: هر ۴ ساعت یک قطره در چشم راست ریخته شود

    PublishPrescriptionRequest:
      type: object
      required: [eyeLaterality, items, reasonFa]
      properties:
        eyeLaterality:
          $ref: "#/components/schemas/EyeLaterality"
        items:
          type: array
          items:
            $ref: "#/components/schemas/DropItemInput"
        reasonFa:
          type: string
          example: کاهش التهاب هفته اول پس از جراحی فیکو

    PrescriptionVersion:
      type: object
      required: [prescriptionId, episodeId, version, eyeLaterality, eyeLabelFa, items, publishedAt]
      properties:
        prescriptionId:
          type: string
          format: uuid
        episodeId:
          type: string
          format: uuid
        version:
          type: integer
        eyeLaterality:
          $ref: "#/components/schemas/EyeLaterality"
        eyeLabelFa:
          type: string
          example: چشم راست
        items:
          type: array
          items:
            $ref: "#/components/schemas/DropItemInput"
        publishedAt:
          type: string
          format: date-time

    PatientTodayDropCard:
      type: object
      required: [episodeId, prescriptionVersion, eyeLaterality, eyeLabelFa, drugNameFa, bottleCapColorFa, scheduledTimeJalali, instructionsFa, taken]
      properties:
        episodeId:
          type: string
          format: uuid
        prescriptionVersion:
          type: integer
        eyeLaterality:
          $ref: "#/components/schemas/EyeLaterality"
        eyeLabelFa:
          type: string
          example: چشم راست
        drugNameFa:
          type: string
          example: قطره سیپروفلوکساسین ۰.۳٪
        bottleCapColorFa:
          type: string
          example: درِ سفید
        scheduledTimeJalali:
          type: string
          example: "۱۴۰۵/۰۹/۰۲ — ۱۴:۰۰"
        instructionsFa:
          type: string
          example: یک قطره در چشم راست، ۵ دقیقه فاصله با قطره بعدی
        taken:
          type: boolean

    PatientTodayResponse:
      type: object
      required: [todayJalali, emergencyHotlinePhone, clinicStaffedHoursFa, scheduleItems]
      properties:
        todayJalali:
          type: string
          example: "۱۴۰۵/۰۹/۰۲"
        emergencyHotlinePhone:
          type: string
          example: "+982182400000"
        clinicStaffedHoursFa:
          type: string
          example: همه‌روزه ۸ تا ۲۰؛ در ساعات غیرکاری به اورژانس چشم مراجعه کنید
        scheduleItems:
          type: array
          items:
            $ref: "#/components/schemas/PatientTodayDropCard"

    AdherenceEventRequest:
      type: object
      required: [eyeLaterality, prescriptionVersion, state, occurredAt]
      properties:
        eyeLaterality:
          $ref: "#/components/schemas/EyeLaterality"
        prescriptionVersion:
          type: integer
        state:
          $ref: "#/components/schemas/AdherenceState"
        reasonFa:
          type: string
          example: فراموشی نوبت ظهر
        occurredAt:
          type: string
          format: date-time

    AdherenceEventResponse:
      type: object
      required: [eventId, episodeId, state, deduplicated, recordedAt]
      properties:
        eventId:
          type: string
          format: uuid
        episodeId:
          type: string
          format: uuid
        state:
          $ref: "#/components/schemas/AdherenceState"
        deduplicated:
          type: boolean
        recordedAt:
          type: string
          format: date-time

    PatientEpisodeWithPrescription:
      type: object
      required: [episode]
      properties:
        episode:
          $ref: "#/components/schemas/CareEpisode"
        activePrescription:
          $ref: "#/components/schemas/PrescriptionVersion"

