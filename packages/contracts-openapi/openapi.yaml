openapi: 3.1.0
info:
  title: Bina AI Platform API
  version: 1.0.0
  description: >
    Canonical OpenAPI 3.1 contract for Bina AI — Unified Iranian Persian-First (fa-IR / Jalali)
    Ophthalmology Care-Operations (Pillar 1) and 6-Layer Multimodal Clinical Diagnostic & Triage AI (Pillar 2).
servers:
  - url: http://127.0.0.1:3000
    description: Local Docker / Backend API
  - url: http://127.0.0.1:4010
    description: Prism Contract Mock Server

tags:
  - name: System
  - name: Auth
  - name: Overview
  - name: Analytics
  - name: CareOperations
  - name: HomeMonitoringR2
  - name: Triage
  - name: DiagnosticsAI
  - name: Reports
  - name: Admin
  - name: Integrations
  - name: Ops
  - name: AiEngineInternal

paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Platform health and runtime profile
      responses:
        "200":
          description: Service healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /v1/clinics/current:
    get:
      tags: [System]
      operationId: getCurrentClinic
      summary: Current clinic metadata (Iran, fa-IR, Jalali, staffed hours, hotline)
      responses:
        "200":
          description: Active clinic profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClinicProfile"

  /v1/auth/staff/session:
    post:
      tags: [Auth]
      operationId: createStaffSession
      summary: Staff OIDC/MFA session exchange
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffSessionRequest"
      responses:
        "200":
          description: Staff session established
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffSessionResponse"

  /v1/auth/staff/step-up:
    post:
      tags: [Auth]
      operationId: performStaffStepUp
      summary: Upgrade staff session with step-up verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffStepUpRequest"
      responses:
        "200":
          description: Step-up verified session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffStepUpResponse"

  /v1/auth/staff/me:
    get:
      tags: [Auth]
      operationId: getStaffMe
      summary: Current authenticated staff profile, capabilities, authorized clinics, and active feature flags
      responses:
        "200":
          description: Staff profile and server-derived capabilities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMeResponse"

  /v1/auth/staff/clinics:
    get:
      tags: [Auth]
      operationId: listAuthorizedStaffClinics
      summary: List clinics within the tenant where the authenticated staff member holds an active membership
      responses:
        "200":
          description: Authorized clinic memberships
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizedClinicListResponse"

  /v1/overview/dashboard:
    get:
      tags: [Overview]
      operationId: getOverviewDashboard
      summary: Operational & clinical overview dashboard KPIs for Staff Web Module A
      responses:
        "200":
          description: Overview dashboard snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverviewDashboardResponse"

  /v1/overview/search:
    get:
      tags: [Overview]
      operationId: searchStaffWorkspace
      summary: Permission-scoped search across patients, diagnostic studies, care episodes, and reports
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
      responses:
        "200":
          description: Scoped workspace search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceSearchResponse"

  /v1/overview/activity:
    get:
      tags: [Overview]
      operationId: listRecentOverviewActivity
      summary: Recent PHI-redacted clinical and operational audit activity feed
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Recent clinic activity feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecentActivityListResponse"

  /v1/auth/patient/otp/request:
    post:
      tags: [Auth]
      operationId: requestPatientOtp
      summary: Request +98 SMS OTP for patient or caregiver login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientOtpRequest"
      responses:
        "202":
          description: OTP queued via domestic Iranian SMS gateway
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpDispatchResponse"

  /v1/auth/patient/otp/verify:
    post:
      tags: [Auth]
      operationId: verifyPatientOtp
      summary: Verify +98 SMS OTP and accept Persian consent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientOtpVerifyRequest"
      responses:
        "200":
          description: Patient session granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientSessionResponse"

  /v1/auth/caregiver/otp/verify:
    post:
      tags: [Auth]
      operationId: verifyCaregiverOtp
      summary: Verify +98 SMS OTP for delegated caregiver login and return accessible patients
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaregiverOtpVerifyRequest"
      responses:
        "200":
          description: Caregiver session granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaregiverSessionResponse"

  /v1/caregiver/patients:
    get:
      tags: [CareOperations]
      operationId: listCaregiverPatients
      summary: List active patient delegations for the authenticated caregiver
      responses:
        "200":
          description: Active delegated patients
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaregiverPatientListResponse"

  /v1/patient/profile:
    get:
      tags: [CareOperations]
      operationId: getPatientProfile
      summary: Get patient profile metadata and accepted Persian consents
      responses:
        "200":
          description: Patient profile and consent history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientProfileResponse"

  /v1/patients:
    get:
      tags: [CareOperations]
      operationId: listPatients
      summary: Paginated clinic patient registry search (masked phones only)
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: accessMode
          in: query
          schema:
            $ref: "#/components/schemas/AccessMode"
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Paginated patient list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientListResponse"
    post:
      tags: [CareOperations]
      operationId: enrollPatientByStaff
      summary: Staff-assisted patient enrollment (app, caregiver, or Print+Phone) with +98 validation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffEnrollPatientRequest"
      responses:
        "201":
          description: Enrolled patient summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffEnrolledPatientResponse"

  /v1/patients/{patientId}:
    get:
      tags: [CareOperations]
      operationId: getPatient360
      summary: Staff Web Patient 360 clinical summary across OD/OS episodes, R2, studies, triage, and consent
      parameters:
        - $ref: "#/components/parameters/PatientIdParam"
      responses:
        "200":
          description: Patient 360 aggregate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient360Response"

  /v1/patients/{patientId}/history:
    get:
      tags: [CareOperations]
      operationId: listPatientClinicalHistory
      summary: List immutable structured clinical history entries for a patient
      parameters:
        - $ref: "#/components/parameters/PatientIdParam"
      responses:
        "200":
          description: Patient clinical history list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientClinicalHistoryListResponse"
    post:
      tags: [CareOperations]
      operationId: addPatientClinicalHistory
      summary: Append immutable structured clinical history/risk-factor entry
      parameters:
        - $ref: "#/components/parameters/PatientIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddClinicalHistoryRequest"
      responses:
        "201":
          description: Clinical history appended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientClinicalHistoryItem"

  /v1/patients/{patientId}/timeline:
    get:
      tags: [CareOperations]
      operationId: getPatientTimeline
      summary: Unified chronological patient timeline across Pillar 1, Pillar 2, and R2 events
      parameters:
        - $ref: "#/components/parameters/PatientIdParam"
      responses:
        "200":
          description: Chronological patient timeline events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientTimelineResponse"

  /v1/patients/{patientId}/consent:
    patch:
      tags: [CareOperations]
      operationId: updatePatientConsent
      summary: Record patient consent acceptance or withdrawal
      parameters:
        - $ref: "#/components/parameters/PatientIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePatientConsentRequest"
      responses:
        "200":
          description: Consent event recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentRecord"

  /v1/patients/{patientId}/caregivers:
    get:
      tags: [CareOperations]
      operationId: listPatientCaregivers
      summary: List caregiver delegations granted for a patient
      parameters:
        - $ref: "#/components/parameters/PatientIdParam"
      responses:
        "200":
          description: Caregiver grant list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaregiverGrantListResponse"
    post:
      tags: [CareOperations]
      operationId: grantCaregiverAccess
      summary: Grant scoped caregiver access to a patient
      parameters:
        - $ref: "#/components/parameters/PatientIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaregiverGrantRequest"
      responses:
        "201":
          description: Caregiver grant created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaregiverGrant"

  /v1/patients/{patientId}/caregivers/{grantId}:
    delete:
      tags: [CareOperations]
      operationId: revokeCaregiverAccess
      summary: Immediately revoke caregiver access (<1s 403 enforcement)
      parameters:
        - $ref: "#/components/parameters/PatientIdParam"
        - $ref: "#/components/parameters/GrantIdParam"
      responses:
        "204":
          description: Caregiver access revoked

  /v1/episodes:
    get:
      tags: [CareOperations]
      operationId: listClinicEpisodes
      summary: Paginated clinic care episodes queue filterable by eye, access mode, status, and patient
      parameters:
        - name: patientId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum: ["active", "completed", "cancelled"]
        - name: eyeLaterality
          in: query
          schema:
            $ref: "#/components/schemas/EyeLaterality"
        - name: accessMode
          in: query
          schema:
            $ref: "#/components/schemas/AccessMode"
        - name: protocolType
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Clinic care episodes list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareEpisodeWorklistResponse"
    post:
      tags: [CareOperations]
      operationId: createCareEpisode
      summary: Create eye-specific (OD or OS) surgical/care episode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEpisodeRequest"
      responses:
        "201":
          description: Care episode created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareEpisode"

  /v1/episodes/{episodeId}:
    get:
      tags: [CareOperations]
      operationId: getCareEpisode
      summary: Get single eye-isolated care episode
      parameters:
        - $ref: "#/components/parameters/EpisodeIdParam"
      responses:
        "200":
          description: Care episode details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareEpisode"

  /v1/episodes/{episodeId}/close:
    patch:
      tags: [CareOperations]
      operationId: closeCareEpisode
      summary: Close or cancel a care episode with audit reason
      parameters:
        - $ref: "#/components/parameters/EpisodeIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloseEpisodeRequest"
      responses:
        "200":
          description: Care episode closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareEpisode"

  /v1/episodes/{episodeId}/prescriptions:
    get:
      tags: [CareOperations]
      operationId: listEpisodePrescriptions
      summary: List immutable eye drop prescription versions v1..vN for diffing
      parameters:
        - $ref: "#/components/parameters/EpisodeIdParam"
      responses:
        "200":
          description: Prescription version history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrescriptionHistoryListResponse"
    post:
      tags: [CareOperations]
      operationId: publishEpisodePrescription
      summary: Publish immutable versioned eye drop prescription (v1..vN)
      parameters:
        - $ref: "#/components/parameters/EpisodeIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishPrescriptionRequest"
      responses:
        "201":
          description: Prescription version published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrescriptionVersion"

  /v1/patient/today:
    get:
      tags: [CareOperations]
      operationId: getPatientTodayPlan
      summary: Get eye-separated Persian Today medication schedule and offline hotline
      responses:
        "200":
          description: Eye-separated daily drop schedule in fa-IR & Jalali
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientTodayResponse"

  /v1/patient/episodes:
    get:
      tags: [CareOperations]
      operationId: listPatientEpisodes
      summary: List active eye-isolated care episodes and latest prescriptions for the patient
      responses:
        "200":
          description: Active eye-isolated care episodes with prescriptions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientEpisodeListResponse"

  /v1/episodes/{episodeId}/adherence:
    get:
      tags: [CareOperations]
      operationId: listMedicationAdherence
      summary: List recorded medication adherence history for a care episode
      parameters:
        - $ref: "#/components/parameters/EpisodeIdParam"
      responses:
        "200":
          description: Adherence event history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdherenceEventListResponse"
    post:
      tags: [CareOperations]
      operationId: recordMedicationAdherence
      summary: Record idempotent 4-state medication adherence event
      parameters:
        - $ref: "#/components/parameters/EpisodeIdParam"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdherenceEventRequest"
      responses:
        "201":
          description: Adherence event recorded (or deduplicated replay)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdherenceEventResponse"

  /v1/episodes/{episodeId}/symptoms:
    get:
      tags: [CareOperations]
      operationId: listEpisodeSymptoms
      summary: List chronological post-op symptom reports submitted for a care episode
      parameters:
        - $ref: "#/components/parameters/EpisodeIdParam"
      responses:
        "200":
          description: Episode symptom history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EpisodeSymptomListResponse"
    post:
      tags: [CareOperations]
      operationId: submitSymptomReport
      summary: Submit post-op structured red-flag or Persian symptom report
      parameters:
        - $ref: "#/components/parameters/EpisodeIdParam"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SymptomReportRequest"
      responses:
        "201":
          description: Symptom evaluated by deterministic clinical rules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SymptomReportResponse"

  /v1/care/print-phone:
    get:
      tags: [CareOperations]
      operationId: listPrintPhoneQueue
      summary: List active non-smartphone Print+Phone parity cohort and outreach status
      responses:
        "200":
          description: Print+Phone cohort queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrintPhoneQueueResponse"

  /v1/care/print-phone/{episodeId}/outreach:
    post:
      tags: [CareOperations]
      operationId: recordPrintPhoneOutreach
      summary: Log Print+Phone coordinator phone check-in or print pack delivery outcome
      parameters:
        - $ref: "#/components/parameters/EpisodeIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrintPhoneOutreachRequest"
      responses:
        "201":
          description: Print+Phone outreach logged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrintPhoneOutreachRecord"

  /v1/triage/cases:
    get:
      tags: [Triage]
      operationId: listTriageCases
      summary: List unified Pillar 1 care-ops and Pillar 2 3-tier urgency triage queue
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: ["New", "OwnerAssigned", "ContactAttempted", "ContactEstablished", "Escalated", "Referred", "Closed"]
        - name: urgencyTier
          in: query
          schema:
            $ref: "#/components/schemas/UrgencyTier"
        - name: sourcePillar
          in: query
          schema:
            type: string
            enum: ["pillar1_care", "pillar2_diagnostic"]
        - name: eyeLaterality
          in: query
          schema:
            $ref: "#/components/schemas/StudyLaterality"
        - name: ownerId
          in: query
          schema:
            type: string
            format: uuid
        - name: unassignedOnly
          in: query
          schema:
            type: boolean
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Prioritized triage queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriageCaseListResponse"

  /v1/triage/cases/{caseId}:
    get:
      tags: [Triage]
      operationId: getTriageCaseDetail
      summary: Get full triage case details including triggers, contact logs, referrals, and follow-up tasks
      parameters:
        - $ref: "#/components/parameters/CaseIdParam"
      responses:
        "200":
          description: Triage case detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriageCaseDetailResponse"

  /v1/triage/cases/{caseId}/contact:
    post:
      tags: [Triage]
      operationId: recordTriageContact
      summary: Log triage contact attempt or contact establishment and advance workflow state
      parameters:
        - $ref: "#/components/parameters/CaseIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriageContactRequest"
      responses:
        "200":
          description: Triage case updated with contact attempt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriageCase"

  /v1/triage/cases/{caseId}/close:
    post:
      tags: [Triage]
      operationId: closeTriageCase
      summary: Close triage case (enforces contact/referral/ophthalmologist verification guard on urgent cases)
      parameters:
        - $ref: "#/components/parameters/CaseIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloseTriageCaseRequest"
      responses:
        "200":
          description: Triage case closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriageCase"

  /v1/triage/cases/{caseId}/claim:
    post:
      tags: [Triage]
      operationId: claimTriageCase
      summary: Claim triage case for active clinician/coordinator ownership
      parameters:
        - $ref: "#/components/parameters/CaseIdParam"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimTriageCaseRequest"
      responses:
        "200":
          description: Triage case claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriageCase"

  /v1/triage/cases/{caseId}/handoff:
    post:
      tags: [Triage]
      operationId: handoffTriageCase
      summary: Shift handoff with Persian note
      parameters:
        - $ref: "#/components/parameters/CaseIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShiftHandoffRequest"
      responses:
        "200":
          description: Triage case handed off
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriageCase"

  /v1/triage/cases/{caseId}/referrals:
    post:
      tags: [Triage]
      operationId: createClosedLoopReferral
      summary: Record closed-loop referral dispatch and attendance tracking
      parameters:
        - $ref: "#/components/parameters/CaseIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReferralRequest"
      responses:
        "201":
          description: Referral tracked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferralRecord"

  /v1/triage/outages:
    get:
      tags: [Triage]
      operationId: listClinicOutages
      summary: List operational clinic channel outages and mitigation windows
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: ["active", "mitigated", "resolved"]
      responses:
        "200":
          description: Clinic outage records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClinicOutageListResponse"
    post:
      tags: [Triage]
      operationId: createClinicOutage
      summary: Log operational outage event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClinicOutageRequest"
      responses:
        "201":
          description: Outage created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClinicOutageRecord"

  /v1/triage/outages/{outageId}:
    patch:
      tags: [Triage]
      operationId: updateClinicOutage
      summary: Update outage mitigation note, severity, or resolve outage
      parameters:
        - $ref: "#/components/parameters/OutageIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClinicOutageRequest"
      responses:
        "200":
          description: Outage updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClinicOutageRecord"

  /v1/referrals:
    get:
      tags: [Triage]
      operationId: listReferrals
      summary: Paginated closed-loop referrals queue
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: ["dispatched", "attended", "missed"]
        - name: urgentOnly
          in: query
          schema:
            type: boolean
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Referrals queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferralListResponse"

  /v1/referrals/{referralId}:
    get:
      tags: [Triage]
      operationId: getReferralDetail
      summary: Retrieve closed-loop referral detail
      parameters:
        - $ref: "#/components/parameters/ReferralIdParam"
