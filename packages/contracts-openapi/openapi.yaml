openapi: 3.1.0
info:
  title: Bina AI Platform API
  version: 1.0.0
  description: >
    Canonical OpenAPI 3.1 contract for Bina AI — Unified Iranian Persian-First (fa-IR / Jalali)
    Ophthalmology Care-Operations (Pillar 1) and 6-Layer Multimodal Clinical Diagnostic & Triage AI (Pillar 2).
servers:
  - url: http://127.0.0.1:3000
    description: Local Docker / Backend API
  - url: http://127.0.0.1:4010
    description: Prism Contract Mock Server

tags:
  - name: System
  - name: Auth
  - name: CareOperations
  - name: HomeMonitoringR2
  - name: Triage
  - name: DiagnosticsAI
  - name: Reports
  - name: AiEngineInternal

paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Platform health and runtime profile
      responses:
        "200":
          description: Service healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /v1/clinics/current:
    get:
      tags: [System]
      operationId: getCurrentClinic
      summary: Current clinic metadata (Iran, fa-IR, Jalali, staffed hours, hotline)
      responses:
        "200":
          description: Active clinic profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClinicProfile"

  /v1/auth/staff/session:
    post:
      tags: [Auth]
      operationId: createStaffSession
      summary: Staff OIDC/MFA session exchange
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffSessionRequest"
      responses:
        "200":
          description: Staff session established
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffSessionResponse"

  /v1/auth/staff/step-up:
    post:
      tags: [Auth]
      operationId: performStaffStepUp
      summary: Upgrade staff session with step-up verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffStepUpRequest"
      responses:
        "200":
          description: Step-up verified session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffStepUpResponse"

  /v1/auth/patient/otp/request:
    post:
      tags: [Auth]
      operationId: requestPatientOtp
      summary: Request +98 SMS OTP for patient or caregiver login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientOtpRequest"
      responses:
        "202":
          description: OTP queued via domestic Iranian SMS gateway
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpDispatchResponse"

  /v1/auth/patient/otp/verify:
    post:
      tags: [Auth]
      operationId: verifyPatientOtp
      summary: Verify +98 SMS OTP and accept Persian consent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatientOtpVerifyRequest"
      responses:
        "200":
          description: Patient session granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientSessionResponse"

  /v1/auth/caregiver/otp/verify:
    post:
      tags: [Auth]
      operationId: verifyCaregiverOtp
      summary: Verify +98 SMS OTP for delegated caregiver login and return accessible patients
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaregiverOtpVerifyRequest"
      responses:
        "200":
          description: Caregiver session granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaregiverSessionResponse"

  /v1/caregiver/patients:
    get:
      tags: [CareOperations]
      operationId: listCaregiverPatients
      summary: List active patient delegations for the authenticated caregiver
      responses:
        "200":
          description: Active delegated patients
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaregiverPatientListResponse"

  /v1/patient/profile:
    get:
      tags: [CareOperations]
      operationId: getPatientProfile
      summary: Get patient profile metadata and accepted Persian consents
      responses:
        "200":
          description: Patient profile and consent history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientProfileResponse"

  /v1/patients/{patientId}/caregivers:
    get:
      tags: [CareOperations]
      operationId: listPatientCaregivers
      summary: List caregiver delegations granted for a patient
      parameters:
        - $ref: "#/components/parameters/PatientIdParam"
      responses:
        "200":
          description: Caregiver grant list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaregiverGrantListResponse"
    post:
      tags: [CareOperations]
      operationId: grantCaregiverAccess
      summary: Grant scoped caregiver access to a patient
      parameters:
        - $ref: "#/components/parameters/PatientIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaregiverGrantRequest"
      responses:
        "201":
          description: Caregiver grant created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaregiverGrant"

  /v1/patients/{patientId}/caregivers/{grantId}:
    delete:
      tags: [CareOperations]
      operationId: revokeCaregiverAccess
      summary: Immediately revoke caregiver access (<1s 403 enforcement)
      parameters:
        - $ref: "#/components/parameters/PatientIdParam"
        - $ref: "#/components/parameters/GrantIdParam"
      responses:
        "204":
          description: Caregiver access revoked

  /v1/episodes:
    post:
      tags: [CareOperations]
      operationId: createCareEpisode
      summary: Create eye-specific (OD or OS) surgical/care episode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEpisodeRequest"
      responses:
        "201":
          description: Care episode created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareEpisode"

  /v1/episodes/{episodeId}:
    get:
      tags: [CareOperations]
      operationId: getCareEpisode
      summary: Get single eye-isolated care episode
      parameters:
        - $ref: "#/components/parameters/EpisodeIdParam"
      responses:
        "200":
          description: Care episode details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareEpisode"

  /v1/episodes/{episodeId}/prescriptions:
    post:
      tags: [CareOperations]
      operationId: publishEpisodePrescription
      summary: Publish immutable versioned eye drop prescription (v1..vN)
      parameters:
        - $ref: "#/components/parameters/EpisodeIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishPrescriptionRequest"
      responses:
        "201":
          description: Prescription version published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrescriptionVersion"

  /v1/patient/today:
    get:
      tags: [CareOperations]
      operationId: getPatientTodayPlan
      summary: Get eye-separated Persian Today medication schedule and offline hotline
      responses:
        "200":
          description: Eye-separated daily drop schedule in fa-IR & Jalali
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientTodayResponse"

  /v1/patient/episodes:
    get:
      tags: [CareOperations]
      operationId: listPatientEpisodes
      summary: List active eye-isolated care episodes and latest prescriptions for the patient
      responses:
        "200":
          description: Active eye-isolated care episodes with prescriptions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientEpisodeListResponse"

  /v1/episodes/{episodeId}/adherence:
    get:
      tags: [CareOperations]
      operationId: listMedicationAdherence
      summary: List recorded medication adherence history for a care episode
      parameters:
        - $ref: "#/components/parameters/EpisodeIdParam"
      responses:
        "200":
          description: Adherence event history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdherenceEventListResponse"
    post:
      tags: [CareOperations]
      operationId: recordMedicationAdherence
      summary: Record idempotent 4-state medication adherence event
      parameters:
        - $ref: "#/components/parameters/EpisodeIdParam"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdherenceEventRequest"
      responses:
        "201":
          description: Adherence event recorded (or deduplicated replay)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdherenceEventResponse"

  /v1/episodes/{episodeId}/symptoms:
    post:
      tags: [CareOperations]
      operationId: submitSymptomReport
      summary: Submit post-op structured red-flag or Persian symptom report
      parameters:
        - $ref: "#/components/parameters/EpisodeIdParam"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SymptomReportRequest"
      responses:
        "201":
          description: Symptom evaluated by deterministic clinical rules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SymptomReportResponse"

  /v1/triage/cases:
    get:
      tags: [Triage]
      operationId: listTriageCases
      summary: List unified Pillar 1 care-ops and Pillar 2 3-tier urgency triage queue
      responses:
        "200":
          description: Prioritized triage queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriageCaseListResponse"

  /v1/triage/cases/{caseId}/claim:
    post:
      tags: [Triage]
      operationId: claimTriageCase
      summary: Claim triage case for active clinician/coordinator ownership
      parameters:
        - $ref: "#/components/parameters/CaseIdParam"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimTriageCaseRequest"
      responses:
        "200":
          description: Triage case claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriageCase"

  /v1/triage/cases/{caseId}/handoff:
    post:
      tags: [Triage]
      operationId: handoffTriageCase
      summary: Shift handoff with Persian note
      parameters:
        - $ref: "#/components/parameters/CaseIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShiftHandoffRequest"
      responses:
        "200":
          description: Triage case handed off
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriageCase"

  /v1/triage/cases/{caseId}/referrals:
    post:
      tags: [Triage]
      operationId: createClosedLoopReferral
      summary: Record closed-loop referral dispatch and attendance tracking
      parameters:
        - $ref: "#/components/parameters/CaseIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReferralRequest"
      responses:
        "201":
          description: Referral tracked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferralRecord"

  /v1/diagnostic-studies:
    post:
      tags: [DiagnosticsAI]
      operationId: submitDiagnosticStudy
      summary: Ingest multimodal diagnostic study and enqueue async 6-layer AI analysis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitDiagnosticStudyRequest"
      responses:
        "202":
          description: Study accepted and queued for Layer 1-4 AI pipeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitDiagnosticStudyResponse"

  /v1/diagnostic-studies/{studyId}:
    get:
      tags: [DiagnosticsAI]
      operationId: getDiagnosticStudy
      summary: Retrieve full 6-layer multimodal study results, masks, auxiliary Grad-CAM, Persian LLM draft, and HITL state
      parameters:
        - $ref: "#/components/parameters/StudyIdParam"
      responses:
        "200":
          description: Multimodal diagnostic study record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosticStudyDetail"

  /v1/diagnostic-studies/{studyId}/signoff:
    post:
      tags: [DiagnosticsAI]
      operationId: signOffDiagnosticStudy
      summary: Mandatory Ophthalmologist HITL sign-off and feedback capture
      parameters:
        - $ref: "#/components/parameters/StudyIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClinicianSignoffRequest"
      responses:
        "200":
          description: Diagnostic study signed by ophthalmologist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClinicianSignoffResponse"

  /v1/patient/diagnostic-summaries:
    get:
      tags: [DiagnosticsAI]
      operationId: listPatientDiagnosticSummaries
      summary: List ophthalmologist-signed patient-safe Persian diagnostic summaries only
      responses:
        "200":
          description: Signed patient-safe summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientDiagnosticSummaryList"

  /v1/r2/calibration-profiles:
    post:
      tags: [HomeMonitoringR2]
      operationId: registerCalibrationProfile
      summary: Register R2 display/distance calibration profile for home vision testing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalibrationProfileRequest"
      responses:
        "201":
          description: Calibration profile saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalibrationProfileResponse"

  /v1/r2/home-tests:
    post:
      tags: [HomeMonitoringR2]
      operationId: submitHomeVisionTest
      summary: Submit calibrated R2 home vision test (Landolt C, Amsler, Contrast) with sensor QC
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HomeVisionTestRequest"
      responses:
        "201":
          description: Home vision test evaluated and stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeVisionTestResponse"

  /v1/r2/patients/{patientId}/trends:
    get:
      tags: [HomeMonitoringR2]
      operationId: getPatientVisionTrends
      summary: Retrieve eye-separated longitudinal R2 vision trends
      parameters:
        - $ref: "#/components/parameters/PatientIdParam"
      responses:
        "200":
          description: Eye-separated vision trend series
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientVisionTrendsResponse"

  /v1/integrations/icare-home2/readings:
    post:
      tags: [HomeMonitoringR2]
      operationId: ingestIcareHome2Reading
      summary: Ingest validated iCare HOME2 home IOP reading
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IcareHome2ReadingRequest"
      responses:
        "201":
          description: IOP reading ingested and evaluated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IcareHome2ReadingResponse"

  /v1/reports:
    post:
      tags: [Reports]
      operationId: createPersianReport
      summary: Generate and store deterministic Persian PDF report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReportRequest"
      responses:
        "201":
          description: Report generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateReportResponse"

  /v1/reports/{reportId}/pdf:
    get:
      tags: [Reports]
      operationId: downloadPersianPdfReport
      summary: Download deterministic Vazirmatn Persian PDF with source_sha256 manifest
      parameters:
        - $ref: "#/components/parameters/ReportIdParam"
      responses:
        "200":
          description: Deterministic Persian PDF binary
          content:
            application/pdf:
              schema:
                type: string
                format: binary

  /v1/ai-engine/qc:
    post:
      tags: [AiEngineInternal]
      operationId: runAiEngineQc
      summary: Internal AI Engine Layer 1 Modality Router and Quality Gate check
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiEngineQcRequest"
      responses:
        "200":
          description: Layer 1 QC evaluation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QcDecision"

  /v1/ai-engine/analyze-study:
    post:
      tags: [AiEngineInternal]
      operationId: runAiEngineAnalysis
      summary: Internal AI Engine Layers 1-4 synchronous execution endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiEngineAnalyzeRequest"
      responses:
        "200":
          description: Complete Layer 1-4 AI engine output
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiEngineAnalyzeResponse"

components:
  parameters:
    PatientIdParam:
      name: patientId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GrantIdParam:
      name: grantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EpisodeIdParam:
      name: episodeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CaseIdParam:
      name: caseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StudyIdParam:
      name: studyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReportIdParam:
      name: reportId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    EyeLaterality:
      type: string
      enum: ["OD", "OS"]
      description: Strict single-eye laterality (OD = چشم راست, OS = چشم چپ)

    StudyLaterality:
      type: string
      enum: ["OD", "OS", "OU"]

    AccessMode:
      type: string
      enum: ["app", "caregiver", "print_phone"]

    StaffRole:
      type: string
      enum: ["ophthalmologist", "optometrist", "technician", "coordinator", "admin"]

    UrgencyTier:
      type: string
      enum: ["routine", "followup_3_6m", "urgent"]

    SeverityGrade:
      type: string
      enum: ["mild", "moderate", "severe", "urgent"]

    DiagnosticModality:
      type: string
      enum: ["fundus", "oct", "octa", "slit_lamp", "topography", "visual_field", "tabular_labs", "unknown"]

    AdherenceState:
      type: string
      enum: ["taken", "missed_with_reason", "unavailable", "no_response"]

    StudyStatus:
      type: string
      enum: ["ingested", "qc_failed", "queued", "analyzed", "pending_hitl", "signed_off"]

    SignoffAction:
      type: string
      enum: ["approved", "edited_approved", "rejected"]

    QcRejectionCode:
      type: string
      enum: ["blur", "lighting", "wrong_eye", "modality_mismatch"]

    AiEngineMode:
      type: string
      enum: ["cpu_stub", "onnx_cpu", "gpu_full"]

    HealthStatus:
      type: object
      required: [status, service, locale, calendar, jurisdiction, aiEngineMode, llmProvider, llmModel, llmConfigured, timestamp]
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: bina-backend
        locale:
          type: string
          example: fa-IR
        calendar:
          type: string
          example: jalali
        jurisdiction:
          type: string
          example: IR
        aiEngineMode:
          $ref: "#/components/schemas/AiEngineMode"
        llmProvider:
          type: string
          example: openai_compatible
        llmModel:
          type: string
          example: thinkingmachines/inkling-2-mini
        llmConfigured:
          type: boolean
        timestamp:
          type: string
          format: date-time

    ClinicProfile:
      type: object
      required: [clinicId, tenantId, nameFa, locale, calendarMode, emergencyPhone, staffedHoursFa]
      properties:
        clinicId:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        nameFa:
          type: string
          example: کلینیک فوق‌تخصصی چشم نور تهران
        locale:
          type: string
          example: fa-IR
        calendarMode:
          type: string
          example: jalali
        emergencyPhone:
          type: string
          example: "+982182400000"
        staffedHoursFa:
          type: string
          example: شنبه تا چهارشنبه ۸ تا ۲۰ — پنج‌شنبه ۸ تا ۱۴
        todayJalali:
          type: string
          example: "۱۴۰۵/۰۹/۰۲"
        currentlyStaffed:
          type: boolean

    StaffStepUpRequest:
      type: object
      required: [stepUpCode]
      properties:
        stepUpCode:
          type: string

    StaffStepUpResponse:
      type: object
      required: [accessToken, stepUpVerified]
      properties:
        accessToken:
          type: string
        stepUpVerified:
          type: boolean

    StaffSessionRequest:
      type: object
      required: [oidcToken, clinicId]
      properties:
        oidcToken:
          type: string
        clinicId:
          type: string
          format: uuid
        mfaCode:
          type: string

    StaffSessionResponse:
      type: object
      required: [accessToken, role, mfaVerified, userId, clinicId, tenantId]
      properties:
        accessToken:
          type: string
        role:
          $ref: "#/components/schemas/StaffRole"
        mfaVerified:
          type: boolean
        userId:
          type: string
          format: uuid
        clinicId:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid

    PatientOtpRequest:
      type: object
      required: [phoneNumber, clinicId]
      properties:
        phoneNumber:
          type: string
          pattern: "^\\+989\\d{9}$"
          example: "+989123456789"
        clinicId:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid

    OtpDispatchResponse:
      type: object
      required: [challengeId, expiresInSeconds, maskedPhone]
      properties:
        challengeId:
          type: string
          format: uuid
        expiresInSeconds:
          type: integer
        maskedPhone:
          type: string
          example: "+98912***6789"

    PatientOtpVerifyRequest:
      type: object
      required: [challengeId, otpCode, consentAccepted, consentVersion, phoneNumber]
      properties:
        challengeId:
          type: string
          format: uuid
        otpCode:
          type: string
          example: "482910"
        consentAccepted:
          type: boolean
        consentVersion:
          type: string
          example: fa-IR-v1.0
        phoneNumber:
          type: string
          pattern: "^\\+989\\d{9}$"
          example: "+989123456789"
        tenantId:
          type: string
          format: uuid

    PatientSessionResponse:
      type: object
      required: [accessToken, patientId, tenantId, locale, calendarMode]
      properties:
        accessToken:
          type: string
        patientId:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        clinicId:
          type: string
          format: uuid
        locale:
          type: string
          example: fa-IR
        calendarMode:
          type: string
          example: jalali

    CaregiverOtpVerifyRequest:
      type: object
      required: [challengeId, otpCode]
      properties:
        challengeId:
          type: string
          format: uuid
        otpCode:
          type: string
          example: "482910"
        tenantId:
          type: string
          format: uuid
        patientId:
          type: string
          format: uuid

    CaregiverPatientLink:
      type: object
      required: [grantId, patientId, patientNameFa, relationshipFa, scopes, clinicId, active, createdAt]
      properties:
        grantId:
          type: string
          format: uuid
        patientId:
          type: string
          format: uuid
        patientNameFa:
          type: string
          example: علی رضایی
        relationshipFa:
          type: string
          example: فرزند بیمار
        scopes:
          type: array
          items:
            type: string
        clinicId:
          type: string
          format: uuid
        active:
